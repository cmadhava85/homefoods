version: 2
updates:
  # npm workspaces (root lockfile). Grouped so routine bumps land as one PR per week;
  # security updates still open immediately. Majors (zod 4, Next 16, drizzle, OTel) come
  # through as separate PRs so each migration is reviewed on its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directories: [/apps/api, /apps/worker, /apps/web]
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
    labels: [dependencies, infra]
