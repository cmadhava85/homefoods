name: ZAP DAST

# Free OWASP ZAP baseline + OpenAPI scan against an ephemeral mock API.
# Never point this at production.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly Monday 03:00 UTC
  push:
    branches: [main, staging]
    paths:
      - "apps/api/**"
      - ".zap/**"
      - "scripts/zap-dast.sh"
      - ".github/workflows/zap.yml"

jobs:
  zap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # No issues write — reports go to artifacts only
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: localmeals
          POSTGRES_PASSWORD: localmeals
          POSTGRES_DB: localmeals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localmeals -d localmeals"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://localmeals:localmeals@localhost:5432/localmeals
      LUNCH_CUTOFF_HOUR: "23"
      LUNCH_CUTOFF_MINUTE: "59"
      MOCK_PAYMENTS: "true"
      MOCK_WHATSAPP: "true"
      MOCK_AUTH: "true"
      AUTH_SECRET: localmeals-dev-auth-secret
      WEB_ORIGIN: http://localhost:3000
      PORT: "4000"
      NODE_ENV: development

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build packages + API
        run: |
          find packages apps -name 'tsconfig.tsbuildinfo' -delete 2>/dev/null || true
          npm run build -w @localmeals/domain
          npm run build -w @localmeals/observability
          npm run build -w @localmeals/adapters
          npm run build -w @localmeals/i18n
          npm run build -w @localmeals/db
          npm run build -w @localmeals/api
          test -f packages/domain/dist/index.js

      - name: Migrate + seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Start API
        run: |
          npm run start -w @localmeals/api &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4000/health >/dev/null; then
              echo "API up"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become healthy" >&2
          exit 1

      - name: ZAP Baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          target: http://localhost:4000
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -m 2 -I"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline

      - name: ZAP API scan (OpenAPI)
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          target: apps/api/openapi.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: "-I -O localhost:4000"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api-scan
