name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

# Least-privilege token for every job in this workflow.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: localmeals
          POSTGRES_PASSWORD: localmeals
          POSTGRES_DB: localmeals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localmeals -d localmeals"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://localmeals:localmeals@localhost:5432/localmeals
      LUNCH_CUTOFF_HOUR: "23"
      LUNCH_CUTOFF_MINUTE: "59"
      MOCK_PAYMENTS: "true"
      MOCK_WHATSAPP: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build packages
        run: |
          # dist/ is gitignored; committed *.tsbuildinfo made tsc no-op on CI
          # (exit 0, empty dist). Force a real emit.
          find packages apps -name 'tsconfig.tsbuildinfo' -delete 2>/dev/null || true
          npm run build -w @localmeals/domain
          npm run build -w @localmeals/observability
          npm run build -w @localmeals/adapters
          npm run build -w @localmeals/i18n
          npm run build -w @localmeals/db
          test -f packages/domain/dist/index.js
          test -f packages/observability/dist/index.js

      - name: Typecheck (packages + api + worker + web)
        run: npm run typecheck

      - name: Migrate + seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Test + coverage gate (all workspaces; per-workspace thresholds)
        run: npm run test:coverage

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: |
            packages/*/coverage/lcov.info
            apps/*/coverage/lcov.info
          retention-days: 30

      - name: Security static check
        run: npm run security:check

      - name: npm audit gate (high+, blocking; reviewed exceptions in security/audit-allowlist.json)
        run: npm run security:audit

      - name: Typecheck web
        run: npm run build -w @localmeals/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright e2e (address → checkout)
        run: npm run test:e2e
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          MOCK_AUTH: "true"
          MOCK_PAYMENTS: "true"
          MOCK_WHATSAPP: "true"
          LUNCH_CUTOFF_HOUR: "23"
          LUNCH_CUTOFF_MINUTE: "59"
